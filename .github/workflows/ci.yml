name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Stub only - verifies the build compiles, NOT that AWS is reachable.
      # Real connectivity is checked by T046's smoke test and /verify-ui.
      - name: Write stub aws-exports.js
        run: |
          cat > src/aws-exports.js <<'EOF'
          const awsmobile = {
              "aws_project_region": "us-east-1",
              "aws_cognito_identity_pool_id": "us-east-1:00000000-0000-0000-0000-000000000000",
              "aws_cognito_region": "us-east-1",
              "aws_user_pools_id": "us-east-1_STUBSTUB1",
              "aws_user_pools_web_client_id": "stubwebclientid00000000000000",
              "oauth": {},
              "aws_cognito_username_attributes": ["EMAIL"],
              "aws_cognito_social_providers": [],
              "aws_cognito_signup_attributes": ["EMAIL"],
              "aws_cognito_mfa_configuration": "OFF",
              "aws_cognito_mfa_types": ["SMS"],
              "aws_cognito_password_protection_settings": {
                  "passwordPolicyMinLength": 8,
                  "passwordPolicyCharacters": []
              },
              "aws_cognito_verification_mechanisms": ["EMAIL"],
              "aws_cloud_logic_custom": [
                  {
                      "name": "nutripilotapi",
                      "endpoint": "https://ci-stub-not-real.invalid/dev",
                      "region": "us-east-1"
                  }
              ],
              "aws_dynamodb_all_tables_region": "us-east-1",
              "aws_dynamodb_table_schemas": [
                  { "tableName": "NutriPilotTable-dev", "region": "us-east-1" }
              ]
          };

          export default awsmobile;
          EOF
      - run: npm run build
